spring.application.name=enrollment
server.port=8083

# ==========================================
# PostgreSQL Database Connection (pgAdmin)
# ==========================================
# Change 'student_db' to the database name you created in pgAdmin
# Change '5432' if your PostgreSQL is running on port 5433
spring.datasource.url=jdbc:postgresql://localhost:5433/enrollment_db
spring.datasource.username=postgres
spring.datasource.password=leang30122006
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / Hibernate Properties
# ==========================================
# 'update' automatically creates or updates tables (e.g., 'students' table)
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Other Microservices
# ==========================================
services.student.url=http://localhost:8081
services.course.url=http://localhost:8082
spring.cloud.compatibility-verifier.enabled=false

# ==========================================
# Security Credentials
# ==========================================
spring.security.user.name=admin
spring.security.user.password=admin123
